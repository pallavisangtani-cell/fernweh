<title>Fernweh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: quiet sidebar of countries and cities, one wide reading column, hairline structure, serif only for names and figures. */
:root{
--bg:#f5f6fa;--surface:#ffffff;--ink:#0e1630;--ink2:#3b4663;--mute:#6b7692;--line:#e4e8f1;--line2:#d3d9e8;
--brand:#2b46c9;--brand-ink:#ffffff;--brand-soft:#edf0fd;--violet:#6a4fd6;
--ok:#0e7a53;--warn:#a05a00;--bad:#c13a1c;
--display:"Fraunces",Georgia,serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0a1126;--surface:#111a33;--ink:#eaeeff;--ink2:#bcc6e4;--mute:#8c98ba;--line:#1d2848;--line2:#2a3860;
--brand:#8fa6ff;--brand-ink:#0a1126;--brand-soft:#16224a;--violet:#a994ff;--ok:#4fd69c;--warn:#f0b445;--bad:#ff8f72;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0a1126;--surface:#111a33;--ink:#eaeeff;--ink2:#bcc6e4;--mute:#8c98ba;--line:#1d2848;--line2:#2a3860;
--brand:#8fa6ff;--brand-ink:#0a1126;--brand-soft:#16224a;--violet:#a994ff;--ok:#4fd69c;--warn:#f0b445;--bad:#ff8f72;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-block:26px 20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:16px;gap:6px}
.word{font:600 1.55rem/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.word i{width:7px;height:7px;border-radius:50%;background:var(--violet);margin-top:8px}
.tag{color:var(--mute);font-size:.78rem;margin:4px 0 18px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.nav:hover{border-color:var(--line2)}
.nav.ai{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.nav small{color:var(--mute);font-weight:400}
.cap{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:20px 0 4px}
.country{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:600}
.country span small{color:var(--mute);font-weight:400;margin-left:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);margin-right:9px}
.dot.v{background:var(--ok)}
.city{display:flex;justify-content:space-between;width:100%;text-align:left;padding:6px 10px;border:0;border-radius:8px;background:none;color:var(--ink2);font:inherit;cursor:pointer}
.city small{color:var(--mute);font-size:.72rem}
.city:hover{background:var(--bg)}
.city.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.addrow{display:flex;gap:6px;margin:4px 0}
.link2{border:0;background:none;color:var(--brand);font:inherit;font-size:.82rem;font-weight:500;padding:4px 0;cursor:pointer;text-align:left}
main{padding-block:38px 80px;padding-left:48px;padding-right:max(32px,env(safe-area-inset-right,0px));min-width:0;max-width:1080px}
h2{font:500 2.15rem/1.12 var(--display);letter-spacing:-.015em}
h3{font-size:.95rem;font-weight:600}
.crumb{font-size:.78rem;color:var(--mute);margin-bottom:6px}
.lede{color:var(--mute);max-width:62ch;margin-top:6px}
.titlebar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.titlebar .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:190px;line-height:1.5}
button{font:inherit;cursor:pointer}
.btn{padding:8px 15px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:500}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
.x{border:0;background:none;color:var(--mute);padding:2px 7px;font-size:1.1rem;line-height:1}
.x:hover{color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:22px;overflow:hidden}
.cell{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.cell:first-child{border-left:0}
.cell label,.cell .l{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:3px}
.cell .v{font:500 1.35rem/1.2 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cell .inl{display:flex;align-items:baseline;gap:6px}
.cell .inl span{color:var(--mute);font-size:.85rem}
.cell input{border:0;background:none;padding:0;font:500 1.35rem/1.2 var(--display);width:100%;border-bottom:1px dashed var(--line2);border-radius:0}
.cell select{border:0;background:none;padding:2px 0;font:500 1.1rem var(--display);width:100%}
.meter{height:5px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.meter.over i{background:var(--bad)}
.note{font-size:.84rem;margin-top:8px;color:var(--mute)}
.note.warn{color:var(--warn)}
.tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin:26px 0 24px}
.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);padding:8px 0 11px;white-space:nowrap;font-weight:500;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--brand)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card .k{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card .big{font:500 2rem/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--mute);font-weight:500}
.fld.g{flex:1;min-width:150px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.b{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:99px;border:0;line-height:1.6;color:var(--mute);background:var(--bg)}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.b.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.b.via{color:var(--brand);background:var(--brand-soft)}
.b.via::before{display:none}
.meta{color:var(--mute);font-size:.82rem}
.money{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:.82rem;color:var(--mute)}
.money input{width:92px;padding:3px 8px;font-size:.82rem}
.money strong{color:var(--ink);font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cardhead b{overflow-wrap:anywhere;font-weight:600}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.dayhead{display:flex;justify-content:space-between;padding:11px 18px;border-bottom:1px solid var(--line);font:500 1.05rem var(--display)}
.dayhead span:last-child{font:500 .8rem var(--body);color:var(--mute);font-variant-numeric:tabular-nums}
.act{padding:14px 18px;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0}
.catrow{margin:12px 0}
.catrow div:first-child{display:flex;justify-content:space-between;font-size:.85rem}
.catrow .meter{margin-top:6px}
.empty{color:var(--mute);padding:14px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:99px;padding:4px 13px;font-size:.8rem;font-weight:500}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.link{border:0;background:none;color:var(--brand);padding:0;font-weight:500;text-align:left}
.pk{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:6px 0}
.pk span{flex:1}
.pk.done span{text-decoration:line-through;color:var(--mute)}
.pcat{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);font-weight:600}
.err{color:var(--bad);font-weight:500;margin-top:10px}
.check{display:flex;gap:9px;align-items:flex-start;margin:12px 0;color:var(--ink2)}
.check input{margin-top:3px}
.divider{border-top:1px solid var(--line);margin:18px 0}
#toast{display:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:.85rem;z-index:50;max-width:90vw}
@media (max-width:820px){
.app{grid-template-columns:minmax(0,1fr)}
aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:26px}
h2{font-size:1.8rem}
.cell{border-left:0;border-top:1px solid var(--line)}
.cell:first-child{border-top:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="app">
<aside>
  <div class="word">Fernweh<i></i></div>
  <div class="tag">Your travel journal</div>
  <button class="nav ai" data-act="brain"><span>AI Brain Box<br><small>Paste plans, bookings, past trips</small></span><span aria-hidden="true">&rarr;</span></button>
  <button class="nav" data-act="world"><span>Passport</span><small id="passport">0 countries</small></button>
  <div class="cap">Destinations</div>
  <div class="addrow"><input id="newCountry" placeholder="Add a country" aria-label="New country" style="flex:1"><button class="btn" data-act="addCountry">Add</button></div>
  <button class="link2" data-act="world">Add a country you have already visited</button>
  <div id="tree"></div>
  <div style="margin-top:auto;padding-top:18px"><button class="btn" data-act="backup" style="width:100%">Backup and restore</button></div>
</aside>
<main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script>
var KEY="travel-journal-v1",S={countries:[]},sel={city:null,tab:"over",view:"city",form:false,confirmDel:null,pcat:"All",pf:"all",shareText:""};
var brain={text:"",busy:false,err:"",res:null,done:false,status:""},shareOpt={itin:true,costs:false,cat:"All"};
var CUR="USD",packBusy=false;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.countries)S.countries=[];
var LISTS=["itin","trans","stays","places","budget","packing"],KS=["itin","trans","stays","places","budget"];
var PCATS=["Food & drink","Hotel","Vineyard","Sights","Activity","Shopping","Other"];
function fix(){S.countries.forEach(function(c){if(!c.status)c.status="planned";if(c.year==null)c.year="";if(c.note==null)c.note="";c.cities.forEach(function(ci){LISTS.forEach(function(k){if(!ci[k])ci[k]=[]});if(!ci.cur)ci.cur="USD";if(ci.notes==null)ci.notes="";if(ci.tbudget==null)ci.tbudget="";if(!ci.status)ci.status="planning"})})}
fix();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}
function arr(v){return Array.isArray(v)?v:[]}
function findCity(id){for(var i=0;i<S.countries.length;i++){var cs=S.countries[i].cities;for(var j=0;j<cs.length;j++)if(cs[j].id===id)return{c:S.countries[i],city:cs[j]}}return null}
function newCity(n,cur,status){return{id:uid(),name:n,cur:cur||"USD",tbudget:"",status:status||"planning",itin:[],trans:[],stays:[],places:[],budget:[],packing:[],notes:""}}
function planned(it){var v=(it.cost!==undefined&&it.cost!=="")?it.cost:it.amount;return parseFloat(v)||0}
function spentOf(it){return parseFloat(it.spent)||0}
function fmt(n){return CUR+" "+(+n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
var toastT;function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){t.style.display="none"},3800)}
async function cap(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}}
async function saveFile(name,data){
  var d=await cap("downloads");
  if(!d){toast("Saving files is not available in this view. Use Copy as text instead.");return}
  try{var r=await d.save({filename:name,data:data});toast(r.status==="saved"?"Saved "+name:"Sent "+name)}
  catch(e){if(e&&e.code!=="declined")toast("Could not save the file ("+((e&&e.code)||"error")+").")}
}
function slug(s){return String(s||"trip").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"trip"}
function mapsUrl(name,city){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(name+", "+city)}

var STAT=[{k:"status",ph:"Status",type:"select",w:120,opts:[["tentative","Tentative"],["confirmed","Confirmed"]]},{k:"booked",ph:"Booking",type:"select",w:120,opts:[["no","Not booked"],["yes","Booked"]]}];
var MONEY=[{k:"cost",ph:"Planned cost",type:"number",w:110},{k:"spent",ph:"Spent so far",type:"number",w:110}];
var TABS={
 over:{label:"Overview"},
 itin:{label:"Itinerary",req:"text",add:"Add activity",fields:[{k:"day",ph:"Day",type:"number",w:70},{k:"time",ph:"Time",type:"time",w:110},{k:"text",ph:"Activity",grow:1},{k:"via",ph:"Provider or venue",w:160}].concat(MONEY,STAT)},
 trans:{label:"Flights & transport",req:"route",add:"Add transport",fields:[{k:"mode",ph:"Mode",type:"select",w:100,opts:["Flight","Train","Bus","Ferry","Car","Taxi","Other"].map(function(x){return[x,x]})},{k:"no",ph:"Flight / train no.",w:130},{k:"route",ph:"Route (e.g. DXB to LIS)",grow:1},{k:"via",ph:"Carrier (e.g. Emirates)",w:170},{k:"date",ph:"Date",type:"date"},{k:"time",ph:"Time",type:"time",w:110},{k:"ref",ph:"Booking ref",w:120}].concat(MONEY,STAT)},
 stays:{label:"Stays",req:"name",add:"Add stay",fields:[{k:"name",ph:"Hotel",grow:1},{k:"via",ph:"Booked via",w:160},{k:"checkin",ph:"Check-in",type:"date"},{k:"checkout",ph:"Check-out",type:"date"},{k:"conf",ph:"Confirmation no.",w:140}].concat(MONEY,STAT)},
 places:{label:"Places",req:"name",add:"Add place",fields:[{k:"name",ph:"Place name",grow:1},{k:"cat",ph:"Category",type:"select",w:140,opts:PCATS.map(function(x){return[x,x]})},{k:"note",ph:"Note",grow:1},{k:"link",ph:"Google Maps link (optional)",grow:1}]},
 budget:{label:"Other costs",req:"label",add:"Add cost",fields:[{k:"label",ph:"Item",grow:1},{k:"cat",ph:"Category",w:130},{k:"cost",ph:"Planned",type:"number",w:110},{k:"spent",ph:"Spent",type:"number",w:110}]},
 packing:{label:"Packing",req:"text",add:"Add item",fields:[{k:"text",ph:"Item to pack",grow:1}]},
 notes:{label:"Notes"}
};
var CATS=[["itin","Activities"],["trans","Transport"],["stays","Stays"],["budget","Other costs"]];
var BOOKABLE=["itin","trans","stays"];
var CURS=["AED","USD","EUR","GBP","JPY","CHF","SGD"];
var STARTER=["Passport","Phone charger","Power adapter","Medication","Toiletries","Comfortable shoes","Travel insurance details","Reusable water bottle"];
var SAMPLES=[["Flight","Emirates EK055 DXB to DUS on 1 Dec, booked, ref HG8P22, 1800 AED. Landing in Düsseldorf, coffee and a look at the Rhine Tower."],["Hotel","Hotel Aloft Frankfurt via Booking.com, 2 to 6 Dec, tentative, 540 EUR, not paid yet."],["Bank SMS","Purchase of EUR 45.50 at Starbucks Düsseldorf Hbf"],["Past trip","Lisbon, Portugal, March 2024. Flew Emirates EK191 DXB to LIS, 2,400 AED. Stayed at Hotel Avenida 12 to 16 March, 540 EUR. Lunch at Time Out Market, pastéis at Manteigaria, day trip to Sintra."]];
var XLSX_SRC="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",MAMMOTH_SRC="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";

function title(k,it){return k==="itin"?it.text:k==="trans"?(it.no?it.no+" · ":"")+it.route:k==="stays"?it.name:k==="budget"?it.label:it.name||it.text}

function renderTree(){
  var h="",v=0;
  S.countries.forEach(function(co){
    if(co.status==="visited")v++;
    h+='<div class="country"><span><i class="dot'+(co.status==="visited"?' v':'')+'"></i>'+esc(co.name)+(co.year?'<small>'+esc(co.year)+'</small>':'')+'</span>'+(sel.confirmDel===co.id?'<span><button class="b warn" data-act="delYes" data-id="'+co.id+'">Remove</button> <button class="x" data-act="delNo" style="font-size:.8rem">Cancel</button></span>':'<button class="x" data-act="delCountry" data-id="'+co.id+'" aria-label="Remove '+esc(co.name)+'">×</button>')+'</div>';
    co.cities.forEach(function(ci){h+='<button class="city'+(ci.id===sel.city&&sel.view==="city"?' on':'')+'" data-act="pick" data-id="'+ci.id+'"><span>'+esc(ci.name)+'</span>'+(ci.status==="completed"?'<small>Done</small>':'')+'</button>'});
    h+='<div class="addrow"><input data-cityin="'+co.id+'" placeholder="Add a city" aria-label="New city in '+esc(co.name)+'" style="flex:1"><button class="btn" data-act="addCity" data-id="'+co.id+'">Add</button></div>';
  });
  $("tree").innerHTML=h;$("passport").textContent=v+(v===1?" country":" countries");
}

function fieldHtml(f){
  var st=f.grow?"":"width:"+(f.w||140)+"px",inp;
  if(f.type==="select")inp='<select data-f="'+f.k+'" aria-label="'+esc(f.ph)+'" style="'+st+'">'+f.opts.map(function(o){return'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>'}).join("")+'</select>';
  else inp='<input data-f="'+f.k+'" type="'+(f.type||"text")+'" aria-label="'+esc(f.ph)+'" style="'+st+'">';
  return '<label class="fld'+(f.grow?' g':'')+'">'+esc(f.ph)+inp+'</label>';
}
function badges(k,it){
  var c=it.status==="confirmed",b=it.booked==="yes",a=' data-list="'+k+'" data-id="'+it.id+'" title="Click to change"';
  return '<div class="badges"><button class="b '+(c?'ok':'warn')+'" data-act="flip" data-k="status"'+a+'>'+(c?'Confirmed':'Tentative')+'</button><button class="b '+(b?'ok':'')+'" data-act="flip" data-k="booked"'+a+'>'+(b?'Booked':'Not booked')+'</button>'+(it.via?'<span class="b via">via '+esc(it.via)+'</span>':'')+'</div>';
}
function moneyHtml(k,it){
  var p=planned(it);
  return '<div class="money"><span>'+(p?'Planned <strong>'+fmt(p)+'</strong>':'No cost set')+'</span><label>Spent <input type="number" data-spent="'+it.id+'" data-list="'+k+'" value="'+esc(it.spent||"")+'" placeholder="0" aria-label="Amount spent"></label></div>';
}
function cardHtml(k,it,city){
  var del='<button class="x" data-act="del" data-list="'+k+'" data-id="'+it.id+'" aria-label="Delete">×</button>',meta="";
  if(k==="itin")meta=it.time||"";
  else if(k==="trans")meta=[it.mode,it.date,it.time,it.ref?"Ref "+it.ref:""].filter(Boolean).join(" · ");
  else if(k==="stays")meta=[(it.checkin||it.checkout)?(it.checkin||"?")+" to "+(it.checkout||"?"):"",it.conf?"Conf. "+it.conf:""].filter(Boolean).join(" · ");
  else if(k==="budget")meta=it.cat||"";
  else if(k==="places"){var u=/^https?:/i.test(it.link||"")?it.link:mapsUrl(it.name,city.name);return '<div class="card"><div class="cardhead"><div><div class="pcat">'+esc(it.cat||"Other")+'</div><b>'+esc(it.name)+'</b></div>'+del+'</div>'+(it.note?'<div class="meta" style="margin-top:4px">'+esc(it.note)+'</div>':'')+'<div style="margin-top:10px"><a class="link" href="'+esc(u)+'" target="_blank" rel="noopener">Open in Maps</a></div></div>'}
  return '<div class="'+(k==="itin"?'act':'card')+'"><div class="cardhead"><div><b>'+esc(title(k,it))+'</b>'+(meta?'<div class="meta">'+esc(meta)+'</div>':'')+'</div>'+del+'</div>'+(BOOKABLE.indexOf(k)>=0?badges(k,it):'')+moneyHtml(k,it)+'</div>';
}

function totals(city){
  var T={all:{p:0,s:0}};
  CATS.forEach(function(x){var p=0,s=0;city[x[0]].forEach(function(it){p+=planned(it);s+=spentOf(it)});T[x[0]]={label:x[1],p:p,s:s};T.all.p+=p;T.all.s+=s});
  return T;
}
function overHtml(city,T){
  var n={c:0,t:0,b:0,u:0,all:0},need=[],car={};
  BOOKABLE.forEach(function(k){city[k].forEach(function(it){
    n.all++;if(it.status==="confirmed")n.c++;else n.t++;
    if(it.booked==="yes")n.b++;else{n.u++;need.push({k:k,it:it})}
    if(k==="trans"&&it.via)car[it.via]=1;
  })});
  var pct=n.all?Math.round(n.b/n.all*100):0,carriers=Object.keys(car);
  var h='<div class="grid g4"><div class="card"><div class="k"><span>Booked</span><span>'+pct+'%</span></div><div class="big">'+n.b+'<span class="meta" style="font:400 .9rem var(--body)"> of '+n.all+'</span></div><div class="meter"><i style="width:'+pct+'%"></i></div></div>';
  h+='<div class="card"><div class="k"><span>Confirmation</span></div><div style="display:flex;gap:26px"><div><div class="big" style="color:var(--ok)">'+n.c+'</div><div class="meta">Confirmed</div></div><div><div class="big" style="color:var(--warn)">'+n.t+'</div><div class="meta">Tentative</div></div></div></div>';
  h+='<div class="card"><div class="k"><span>Carriers</span></div><div style="font-weight:600;margin-top:10px">'+(carriers.length?esc(carriers.join(", ")):'None added yet')+'</div><div class="meta">From your transport</div></div>';
  h+='<div class="card"><div class="k"><span>Still to book</span></div><div class="big" style="color:'+(n.u?'var(--bad)':'var(--ok)')+'">'+n.u+'</div><div class="meta">items not booked yet</div></div></div>';
  h+='<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Cost by category</h3>';
  CATS.forEach(function(x){var t=T[x[0]],p=t.p?Math.min(100,t.s/t.p*100):0;h+='<div class="catrow"><div><span>'+t.label+'</span><span style="font-variant-numeric:tabular-nums">'+fmt(t.s)+' of '+fmt(t.p)+'</span></div><div class="meter'+(t.s>t.p&&t.p?' over':'')+'"><i style="width:'+p+'%"></i></div></div>'});
  h+='</div><div class="card"><h3>Still to book or confirm</h3>';
  if(!need.length)h+='<p class="empty">Nothing waiting. Everything is booked.</p>';
  need.slice(0,10).forEach(function(x){var it=x.it;h+='<div style="padding:11px 0;border-top:1px solid var(--line);margin-top:10px"><b>'+esc(title(x.k,it))+'</b><div class="meta">'+TABS[x.k].label+'</div>'+badges(x.k,it)+'</div>'});
  return h+'</div></div>';
}

function sortKey(k,a,b){
  if(k==="itin")return (parseFloat(a.day)||0)-(parseFloat(b.day)||0)||String(a.time).localeCompare(b.time);
  if(k==="trans")return String(a.date).localeCompare(b.date)||String(a.time).localeCompare(b.time);
  if(k==="stays")return String(a.checkin).localeCompare(String(b.checkin));
  return 0;
}
function curSelect(city){
  var l=CURS.indexOf(city.cur)<0?CURS.concat([city.cur]):CURS;
  return '<select data-cur="1" id="cursel" aria-label="Currency">'+l.map(function(c){return'<option'+(c===city.cur?' selected':'')+'>'+c+'</option>'}).join("")+'</select>';
}
function catCounts(list){var m={};list.forEach(function(x){var c=x.cat||"Other";m[c]=(m[c]||0)+1});return m}
function tabHtml(city,T){
  var k=sel.tab,Tb=TABS[k],h="";
  if(k==="over")return overHtml(city,T);
  if(k==="notes")return '<textarea id="notes" aria-label="Notes" style="min-height:320px" placeholder="Neighbourhoods, tips, transport, food to try, things to avoid…">'+esc(city.notes)+'</textarea>';
  h+='<div class="head"><h3>'+Tb.label+'</h3><div class="acts">';
  if(k==="places")h+='<button class="btn" data-act="importPick">Import Maps CSV</button><input type="file" id="csv" accept=".csv,text/csv" hidden>';
  if(k==="packing")h+='<button class="btn" data-act="suggestPack"'+(packBusy?' disabled':'')+'>'+(packBusy?'Thinking…':'Suggest for this trip')+'</button>'+(city.packing.length?'':'<button class="btn" data-act="starter">Starter list</button>');
  h+='<button class="btn pri" data-act="toggleForm">'+(sel.form?'Close':'Add '+Tb.add.replace(/^Add /,''))+'</button></div></div>';
  if(sel.form)h+='<div class="card" style="margin-bottom:14px"><div class="row" id="form" style="margin:0">'+Tb.fields.map(fieldHtml).join("")+'<button class="btn pri" data-act="add">Save</button></div></div>';
  var list=city[k].slice().sort(function(a,b){return sortKey(k,a,b)});
  if(k==="places"&&list.length){
    var cc=catCounts(list),names=Object.keys(cc);
    h+='<div class="chips"><button class="chip'+(sel.pcat==="All"?' on':'')+'" data-act="pcat" data-id="All">All '+list.length+'</button>'+names.map(function(c){return'<button class="chip'+(sel.pcat===c?' on':'')+'" data-act="pcat" data-id="'+esc(c)+'">'+esc(c)+' '+cc[c]+'</button>'}).join("")+'</div>';
    if(sel.pcat!=="All")list=list.filter(function(x){return (x.cat||"Other")===sel.pcat});
  }
  if(!list.length)return h+'<p class="empty">Nothing here yet.</p>';
  if(k==="itin"){
    var days={};list.forEach(function(it){var d=it.day||"?";(days[d]=days[d]||[]).push(it)});
    Object.keys(days).forEach(function(d){var p=0,s=0;days[d].forEach(function(it){p+=planned(it);s+=spentOf(it)});h+='<div class="daycard"><div class="dayhead"><span>Day '+esc(d)+'</span><span>'+fmt(s)+' of '+fmt(p)+'</span></div>'+days[d].map(function(it){return cardHtml("itin",it,city)}).join("")+'</div>'});
  }else if(k==="packing"){
    list.forEach(function(it){h+='<div class="pk'+(it.done?' done':'')+'"><input type="checkbox" data-act="tick" data-id="'+it.id+'"'+(it.done?' checked':'')+' aria-label="Packed"><span>'+esc(it.text)+'</span><button class="x" data-act="del" data-list="packing" data-id="'+it.id+'" aria-label="Delete">×</button></div>'});
    h+='<p class="meta" style="margin-top:8px">'+list.filter(function(x){return x.done}).length+' of '+list.length+' packed</p>';
  }else h+='<div class="grid g2">'+list.map(function(it){return cardHtml(k,it,city)}).join("")+'</div>';
  return h;
}
function renderMain(){
  var m=$("main"),f=sel.city&&findCity(sel.city);
  if(sel.view==="brain"){m.innerHTML=brainHtml();return}
  if(sel.view==="backup"){m.innerHTML=backupHtml();return}
  if(sel.view==="world"||!f){m.innerHTML=worldHtml();return}
  var city=f.city;CUR=city.cur||"USD";
  if(sel.view==="share"){m.innerHTML=shareView(f);return}
  var T=totals(city),bud=parseFloat(city.tbudget)||0,base=bud||T.all.p,left=base-T.all.s,pct=base?Math.min(100,T.all.s/base*100):0,done=city.status==="completed";
  var h='<div class="crumb">'+esc(f.c.name)+'</div><div class="titlebar"><div class="row1"><h2>'+esc(city.name)+'</h2><span class="b '+(done?'ok':'via')+'">'+(done?'Completed':'Planning')+'</span></div><div class="acts"><button class="btn" data-act="toggleDone">'+(done?'Reopen trip':'Mark as completed')+'</button><button class="btn pri" data-act="share">Share trip</button></div></div>';
  h+='<div class="strip"><div class="cell"><label for="tb">Trip budget</label><div class="inl"><span>'+esc(CUR)+'</span><input id="tb" data-tb="1" type="number" min="0" placeholder="Set budget" value="'+esc(city.tbudget)+'"></div></div><div class="cell"><div class="l">Planned</div><div class="v">'+esc(fmt(T.all.p))+'</div></div><div class="cell"><div class="l">Spent</div><div class="v">'+esc(fmt(T.all.s))+'</div></div><div class="cell"><div class="l">'+(left<0?'Over by':(bud?'Left of budget':'Left of plan'))+'</div><div class="v" style="color:'+(left<0?'var(--bad)':'var(--ink)')+'">'+esc(fmt(Math.abs(left)))+'</div></div><div class="cell"><label for="cursel">Currency</label>'+curSelect(city)+'</div></div>';
  h+='<div class="meter'+(left<0?' over':'')+'" role="img" aria-label="'+Math.round(pct)+'% of '+(bud?'trip budget':'planned costs')+' spent"><i style="width:'+pct+'%"></i></div>';
  if(!bud)h+='<p class="note">Set a trip budget above to track spending against it. Until then, spending is compared with your planned costs.</p>';
  else if(T.all.p>bud)h+='<p class="note warn">Planned costs are '+esc(fmt(T.all.p-bud))+' over your trip budget.</p>';
  h+='<div class="tabs" role="tablist">';
  Object.keys(TABS).forEach(function(k){h+='<button class="tab'+(k===sel.tab?' on':'')+'" role="tab" data-act="tab" data-id="'+k+'">'+TABS[k].label+'</button>'});
  m.innerHTML=h+'</div>'+tabHtml(city,T);
}

/* ---------- Passport ---------- */
function worldHtml(){
  var vis=S.countries.filter(function(c){return c.status==="visited"}).length,pl=S.countries.length-vis;
  var h='<div class="crumb">Passport</div><h2>Where you have been</h2><p class="lede">Add countries you have already visited without planning anything, or mark a planned country as visited once you return.</p>';
  h+='<div class="panel"><h3>Add a country you have visited</h3><div class="row"><label class="fld g">Country<input id="pc-name" placeholder="e.g. Japan"></label><label class="fld" style="width:110px">Year<input id="pc-year" placeholder="e.g. 2019" inputmode="numeric"></label><label class="fld g">Cities (optional, comma separated)<input id="pc-cities" placeholder="Tokyo, Kyoto"></label><label class="fld g">Note (optional)<input id="pc-note" placeholder="Cherry blossom season"></label><button class="btn pri" data-act="addPast">Add to passport</button></div></div>';
  if(!S.countries.length)return h+'<p class="empty">No countries yet.</p>';
  h+='<div class="head" style="margin-top:26px"><h3>'+vis+' visited · '+pl+' planned</h3><div class="chips" style="margin:0">'+[["all","All"],["visited","Visited"],["planned","Planned"]].map(function(c){return'<button class="chip'+(sel.pf===c[0]?' on':'')+'" data-act="pf" data-id="'+c[0]+'">'+c[1]+'</button>'}).join("")+'</div></div>';
  var list=S.countries.filter(function(c){return sel.pf==="all"||c.status===sel.pf}).slice().sort(function(a,b){
    if(a.status!==b.status)return a.status==="visited"?-1:1;
    return (parseInt(b.year)||0)-(parseInt(a.year)||0)||a.name.localeCompare(b.name)});
  if(!list.length)h+='<p class="empty">Nothing in this view.</p>';
  h+='<div class="grid g2">';
  list.forEach(function(co){
    var v=co.status==="visited",items=0;co.cities.forEach(function(ci){BOOKABLE.forEach(function(k){items+=ci[k].length})});
    h+='<div class="card"><div class="cardhead"><h3 style="font:500 1.3rem var(--display)">'+esc(co.name)+'</h3><button class="b '+(v?'ok':'via')+'" data-act="cstatus" data-id="'+co.id+'" title="Click to change">'+(v?'Visited':'Planned')+'</button></div><div class="meta" style="margin-top:2px">'+co.cities.length+(co.cities.length===1?' city':' cities')+' · '+items+' bookings</div><div class="row" style="margin:12px 0 4px"><label class="fld" style="width:90px">Year<input data-cyear="'+co.id+'" value="'+esc(co.year)+'" inputmode="numeric"></label><label class="fld g">Note<input data-cnote="'+co.id+'" value="'+esc(co.note)+'"></label></div><div class="chips">'+co.cities.map(function(ci){return'<button class="chip" data-act="pick" data-id="'+ci.id+'">'+esc(ci.name)+'</button>'}).join("")+'</div></div>';
  });
  return h+'</div>';
}
function addPast(){
  var name=$("pc-name").value.trim();if(!name){toast("Enter a country name first.");return}
  var year=$("pc-year").value.trim(),cs=$("pc-cities").value.split(",").map(function(x){return x.trim()}).filter(Boolean),note=$("pc-note").value.trim();
  var co=S.countries.filter(function(c){return c.name.toLowerCase()===name.toLowerCase()})[0];
  if(!co){co={id:uid(),name:name,status:"visited",year:year,note:note,cities:[]};S.countries.push(co)}
  else{co.status="visited";if(year)co.year=year;if(note)co.note=note}
  cs.forEach(function(n){if(!co.cities.some(function(c){return c.name.toLowerCase()===n.toLowerCase()})){co.cities.push(newCity(n,"USD","completed"))}});
  save();renderTree();renderMain();toast(name+" added to your passport.");
}

/* ---------- Share ---------- */
function shareItems(city){
  var out=[],seen={};
  city.places.forEach(function(p){var k=p.name.toLowerCase();if(seen[k])return;seen[k]=1;out.push({name:p.name,cat:p.cat||"Other",note:p.note||"",url:/^https?:/i.test(p.link||"")?p.link:mapsUrl(p.name,city.name)})});
  city.stays.forEach(function(s){var k=s.name.toLowerCase();if(seen[k])return;seen[k]=1;out.push({name:s.name,cat:"Hotel",note:(s.checkin||s.checkout)?(s.checkin||"?")+" to "+(s.checkout||"?"):"",url:mapsUrl(s.name,city.name)})});
  return out;
}
function catsOf(items){var c=[];PCATS.forEach(function(x){if(items.some(function(i){return i.cat===x}))c.push(x)});items.forEach(function(i){if(c.indexOf(i.cat)<0)c.push(i.cat)});return c}
function shareView(f){

  h+='<div class="panel"><div class="head" style="margin:0"><div><h3>'+esc(city.name)+', '+esc(f.c.name)+'</h3><div class="meta">'+(done?'Completed trip':'Trip in planning')+' · '+items.length+' places and stays</div></div></div>';
  h+='<label class="check"><input type="checkbox" data-act="shopt" data-k="itin"'+(shareOpt.itin?' checked':'')+'><span>Include the day-by-day itinerary</span></label><label class="check" style="margin-top:0"><input type="checkbox" data-act="shopt" data-k="costs"'+(shareOpt.costs?' checked':'')+'><span>Include budget and costs</span></label>';
  h+='<div class="divider"></div>';
  if(!items.length)h+='<p class="empty">Add places on the Places tab, or paste details into the Brain Box, to build the list.</p>';
  else{
    h+='<div class="chips"><button class="chip'+(shareOpt.cat==="All"?' on':'')+'" data-act="shcat" data-id="All">All '+items.length+'</button>'+cats.map(function(c){return'<button class="chip'+(shareOpt.cat===c?' on':'')+'" data-act="shcat" data-id="'+esc(c)+'">'+esc(c)+' '+items.filter(function(i){return i.cat===c}).length+'</button>'}).join("")+'</div>';
    h+='<div class="grid g2">'+items.filter(function(i){return shareOpt.cat==="All"||i.cat===shareOpt.cat}).map(function(i){return'<div class="card"><div class="pcat">'+esc(i.cat)+'</div><b>'+esc(i.name)+'</b>'+(i.note?'<div class="meta">'+esc(i.note)+'</div>':'')+'<div style="margin-top:8px"><a class="link" href="'+esc(i.url)+'" target="_blank" rel="noopener">Open in Maps</a></div></div>'}).join("")+'</div>';
  }
  h+='<div class="row" style="margin-top:22px"><button class="btn pri" data-act="dlShare">Download shareable page</button><button class="btn" data-act="copyShare">Copy as text</button><button class="btn" data-act="dlCsv">Download sheet (CSV)</button></div>';
  if(sel.shareText)h+='<p class="meta">Select and copy this text:</p><textarea id="shtxt" readonly style="min-height:160px">'+esc(sel.shareText)+'</textarea>';
  return h+'</div>';
}
function shareFilter(){

}
var SHARE_CSS='*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#0e1630;font:15px/1.55 Inter,system-ui,sans-serif}main{max-width:760px;margin:0 auto;padding:40px 20px 64px}h1{font:600 2.3rem/1.1 Georgia,serif;margin:4px 0 6px}h2{font:600 1.15rem Georgia,serif;margin:34px 0 10px}.k{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#6b7692;font-weight:600}.m{color:#6b7692;font-size:.88rem}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.chip{border:1px solid #d3d9e8;background:#fff;color:#3b4663;border-radius:99px;padding:5px 14px;font:inherit;font-size:.82rem;cursor:pointer}.chip.on{background:#2b46c9;color:#fff;border-color:#2b46c9}.pl{background:#fff;border:1px solid #e4e8f1;border-radius:12px;padding:14px 16px;margin:8px 0}.pl[hidden]{display:none}.pl b{display:block}.tag{font-size:.72rem;color:#2b46c9;font-weight:600;text-transform:uppercase;letter-spacing:.06em}.day{background:#fff;border:1px solid #e4e8f1;border-radius:12px;padding:6px 16px 10px;margin:8px 0}.day h3{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:#2b46c9;margin:10px 0 4px}.act{padding:8px 0;border-top:1px solid #e4e8f1}a{color:#2b46c9}@media(prefers-color-scheme:dark){body{background:#0a1126;color:#eaeeff}.pl,.day{background:#111a33;border-color:#1d2848}.act{border-color:#1d2848}.m,.k{color:#8c98ba}.chip{background:#111a33;color:#bcc6e4;border-color:#2a3860}.chip.on{background:#8fa6ff;color:#0a1126;border-color:#8fa6ff}a,.tag,.day h3{color:#8fa6ff}}';

function shareText(f){

function normRes(r,cur){
  var B=['status','booked'],C=['city','country'];
  var res={
    country:String(r.country||(cur&&cur.c.name)||'').trim(),city:String(r.city||(cur&&cur.city.name)||'').trim(),currency:String(r.currency||'').trim().toUpperCase().slice(0,4),
    itin:arr(r.itin).map(function(o){return norm(o,['day','time','text','via','cost','spent'].concat(C,B))}),
    trans:arr(r.trans).map(function(o){return norm(o,['mode','no','route','via','date','time','ref','cost','spent'].concat(C,B))}),
    stays:arr(r.stays).map(function(o){return norm(o,['name','via','checkin','checkout','conf','cost','spent'].concat(C,B))}),
    places:arr(r.places).map(function(o){return norm(o,['name','cat','note','link'].concat(C))}),
    budget:arr(r.budget).map(function(o){return norm(o,['label','cat','cost','spent'].concat(C))}),
    packing:arr(r.packing).map(function(o){return norm(o,['text'])}),
    notes:String(r.notes||'').trim()
  };
  res.places.forEach(function(p){if(PCATS.indexOf(p.cat)<0)p.cat='Other'});
  KS.forEach(function(k){res[k].forEach(function(x){x.city=x.city||res.city;x.country=x.country||res.country})});
  if(!res.city){var first=[].concat(res.itin,res.trans,res.stays,res.places,res.budget).filter(function(x){return x.city&&x.country})[0];if(first){res.city=first.city;res.country=first.country}}
  return res;
}
function mergeRes(a,b){

  if(b.notes)a.notes=(a.notes?a.notes+'\n\n':'')+b.notes;
  if(!a.city){a.city=b.city;a.country=b.country}
  if(!a.currency)a.currency=b.currency;
  return a;
}
function chunkText(t,n){
  var out=[],cur='';
  t.split('\n').forEach(function(line){if(cur.length+line.length+1>n&&cur){out.push(cur);cur=''}cur+=line+'\n'});
  if(cur.trim())out.push(cur);
  return out;
}

/* ---------- Maps CSV ---------- */
function parseCSV(t){
  var rows=[],r=[],c="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=""}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=""}
    else c+=ch;
  }
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
function importCSV(text){
  var f=findCity(sel.city);if(!f)return;

  var ti=head.indexOf("title"),ni=head.indexOf("note"),ci=head.indexOf("comment"),ui=head.indexOf("url");
  if(ti<0)ti=0;
  rows.slice(1).forEach(function(r){var name=(r[ti]||"").trim();if(!name)return;
    f.city.places.push({id:uid(),name:name,cat:"Other",note:((ni>=0&&r[ni])||(ci>=0&&r[ci])||"").trim(),link:ui>=0?(r[ui]||"").trim():""})});
  save();renderMain();toast("Places imported. Set a type on each one so they filter when you share.");
}

document.addEventListener("input",function(e){
  if(e.target.id==="brainIn"){brain.text=e.target.value;return}
  if(e.target.id==="notes"){var f=findCity(sel.city);if(f){f.city.notes=e.target.value;save()}}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;var t=e.target;
  if(t.id==="newCountry")document.querySelector('[data-act="addCountry"]').click();
  else if(t.dataset&&t.dataset.cityin)t.nextElementSibling.click();
  else if(t.dataset&&t.dataset.f)document.querySelector('[data-act="add"]').click();
});
renderTree();renderMain();
</script>
